# ros2_control controllers for the Go1 in Gazebo (loaded by gz_ros2_control from the URDF).
controller_manager:
  ros__parameters:
    update_rate: 1000            # match the physics step (worlds/flat.sdf)
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_commands:
      type: forward_command_controller/ForwardCommandController

joint_commands:
  ros__parameters:
    interface_name: effort       # the URDF exposes effort command interfaces
    joints:                      # SAME order as policy.npz metadata.joint_names (MuJoCo actuator order)
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
