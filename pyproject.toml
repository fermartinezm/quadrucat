[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrucat"
version = "0.1.0"
description = "Go1 velocity-tracking locomotion with MuJoCo Playground + Brax PPO, deployed in Gazebo via ROS2"
requires-python = ">=3.10"
# Kept minimal so `pip install -e . --no-deps` works in a ROS2 env; training deps are in requirements.txt
dependencies = ["numpy", "pyyaml"]

[tool.setuptools]
packages = ["quadrucat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
